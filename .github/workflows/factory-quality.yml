name: Factory Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run catalog
      - name: Verify catalog is generator-ready
        run: test -s generated/catalog.json
      - name: Build Factory application
        run: npm run build
      - name: Verify C2 compatibility and generated production projects
        run: npm run codegen:check
