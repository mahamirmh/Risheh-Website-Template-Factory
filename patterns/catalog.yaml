standards:
  required_content_rule: "Every pattern implementation declares required and optional content explicitly."
  responsive_rule: "No essential behavior may rely on hover, fixed viewport height, or desktop-only composition."
  accessibility_rule: "Semantic HTML, keyboard access, visible focus, AA contrast and reduced-motion support are mandatory."
  brand_rule: "Patterns describe behavior and structure; they must never reproduce a reference brand's trade dress."
